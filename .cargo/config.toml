# Needs rust 1.100+ (2026-11-12). Preemptive until rust-tool chain bumped.
# Prevent installing crates less than 7 days old to add time for vulnerabilities to be discovered.
# Can be overridden with CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE=allow cargo update -p <crate>
[registry]
global-min-publish-age = "7 days"
